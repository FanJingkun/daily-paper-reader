          query: Cooperative Multi-Agent Learning
        - keyword: Multi-Agent Reinforcement Learning
          keyword_cn: ''
          query: Multi-Agent Reinforcement Learning
      intent_queries:
        - query: >-
            Find transferable multi agent reinforcement learning methods evaluated in navigation, control, games,
            routing, task allocation, traffic, robotics, or combinatorial decision making tasks.
          query_cn: 查找在导航、控制、博弈、路由、任务分配、交通、机器人或组合决策任务中验证的可迁移多智能体强化学习方法。
          enabled: true
          source: manual
          note: ''
        - query: >-
            Find multi agent reinforcement learning methods addressing credit assignment, coordination, reward design,
            long horizon optimization, or system level objectives.
          query_cn: 查找解决信用分配、协同、奖励设计、长时域优化或系统级目标问题的多智能体强化学习方法。
          enabled: true
          source: manual
          note: ''
        - query: >-
            Find multi agent learning methods involving communication, message passing, graph neural networks, attention
            mechanisms, neighbor interaction, or shared policy representations.
          query_cn: 查找涉及通信、消息传递、图神经网络、注意力机制、邻居交互或共享策略表征的多智能体学习方法。
          enabled: true
          source: manual
          note: ''
        - query: >-
            Find general multi agent reinforcement learning methods for cooperative, competitive, or mixed decision
            making under partial observability.
          query_cn: 查找部分可观测条件下用于协作、竞争或混合决策任务的通用多智能体强化学习方法。
          enabled: true
          source: manual
          note: ''
      updated_at: '2026-08-04T02:48:30.899Z'
      paused: true
    - tag: maspd
      description: MAPF、LMAPF、导航、运动规划、路由及隐式空间移动与协同决策研究。
      enabled: true
      paper_sources:
        - arxiv
        - biorxiv
      keywords:
        - keyword: Multi-Agent Routing
          keyword_cn: ''
          query: Multi-Agent Routing
        - keyword: Multi-Robot Motion Planning
          keyword_cn: ''
          query: Multi-Robot Motion Planning
        - keyword: Cooperative Path Planning
          keyword_cn: ''
          query: Cooperative Path Planning
        - keyword: Multi-Agent Navigation
          keyword_cn: ''
          query: Multi-Agent Navigation
        - keyword: Multi-Agent Path Finding
          keyword_cn: ''
          query: Evolutionary Policy Search
        - keyword: Lifelong Multi-Agent Path Finding
          keyword_cn: ''
          query: Evolutionary Reinforcement Learning
      intent_queries:
        - query: >-
            Find multi agent spatial decision making methods addressing dynamic interactions, congestion, bottlenecks,
            collision avoidance, task throughput, or long term coordination in discrete or continuous environments.
          query_cn: 查找在离散或连续环境中解决动态交互、拥堵、瓶颈、避碰、任务吞吐量或长期协调问题的方法。
          enabled: true
          source: manual
          note: ''
        - query: >-
            Find learning methods that incorporate heuristic planning, reference paths, path priors, search guidance, or
            global goal information into decentralized multi agent policies.
          query_cn: 查找将启发式规划、参考路径、路径先验、搜索引导或全局目标信息融入去中心化多智能体策略的方法。
          enabled: true
          source: manual
          note: ''
        - query: >-
            Find studies in which multiple agents make spatial movement, route selection, goal selection, collision
            avoidance, pursuit, coverage, formation, or transportation decisions, even when the task is not explicitly
            called path planning.
          query_cn: 查找多个智能体需要进行空间移动、路线选择、目标选择、避碰、追踪、覆盖、编队或运输决策的研究，即使任务没有明确称为路径规划。
          enabled: true
          source: manual
          note: ''
        - query: >-
            Find reinforcement learning, imitation learning, or planning based methods for multi agent path finding,
            lifelong multi agent path finding, cooperative navigation, and motion planning.
          query_cn: 查找用于 MAPF、LMAPF、协作导航和运动规划的强化学习、模仿学习或规划方法。
          enabled: true
          source: manual
          note: ''
      updated_at: '2026-08-04T02:55:38.652Z'
      paused: true
