subscriptions:
  schema_migration:
    stage: A
    diff_threshold_pct: 15
  keyword_recall_mode: or
  intent_profiles:
    - tag: mcd
      description: 多智能体强化学习、协同决策、通信交互、信用分配与长期策略优化。
      enabled: true
      paper_sources:
        - arxiv
        - biorxiv
      keywords:
        - keyword: Multi-Agent Communication
          keyword_cn: ''
          query: Multi-Agent Communication
        - keyword: Multi-Agent Credit Assignment
          keyword_cn: ''
          query: Multi-Agent Credit Assignment
        - keyword: Centralized Training Decentralized Execution
          keyword_cn: ''
          query: Centralized Training Decentralized Execution
        - keyword: Competitive Multi-Agent Learning
          keyword_cn: ''
          query: Competitive Multi-Agent Learning
        - keyword: Cooperative Multi-Agent Learning
          keyword_cn: ''
          query: Cooperative Multi-Agent Learning
        - keyword: Multi-Agent Reinforcement Learning
          keyword_cn: ''
          query: Multi-Agent Reinforcement Learning
      intent_queries:
        - query: >-
            Find transferable multi agent reinforcement learning methods evaluated in navigation, control, games,
            routing, task allocation, traffic, robotics, or combinatorial decision making tasks.
          query_cn: 查找在导航、控制、博弈、路由、任务分配、交通、机器人或组合决策任务中验证的可迁移多智能体强化学习方法。
          enabled: true
          source: manual
          note: ''
        - query: >-
            Find multi agent reinforcement learning methods addressing credit assignment, coordination, reward design,
            long horizon optimization, or system level objectives.
          query_cn: 查找解决信用分配、协同、奖励设计、长时域优化或系统级目标问题的多智能体强化学习方法。
          enabled: true
          source: manual
          note: ''
        - query: >-
            Find multi agent learning methods involving communication, message passing, graph neural networks, attention
            mechanisms, neighbor interaction, or shared policy representations.
          query_cn: 查找涉及通信、消息传递、图神经网络、注意力机制、邻居交互或共享策略表征的多智能体学习方法。
          enabled: true
          source: manual
          note: ''
        - query: >-
            Find general multi agent reinforcement learning methods for cooperative, competitive, or mixed decision
            making under partial observability.
          query_cn: 查找部分可观测条件下用于协作、竞争或混合决策任务的通用多智能体强化学习方法。
          enabled: true
          source: manual
          note: ''
      updated_at: '2026-08-04T02:48:30.899Z'
      paused: true
    - tag: maspd
      description: MAPF、LMAPF、导航、运动规划、路由及隐式空间移动与协同决策研究。
      enabled: true
      paper_sources:
        - arxiv
        - biorxiv
      keywords:
        - keyword: Multi-Agent Routing
          keyword_cn: ''
          query: Multi-Agent Routing
        - keyword: Multi-Robot Motion Planning
          keyword_cn: ''
          query: Multi-Robot Motion Planning
        - keyword: Cooperative Path Planning
          keyword_cn: ''
          query: Cooperative Path Planning
        - keyword: Multi-Agent Navigation
          keyword_cn: ''
          query: Multi-Agent Navigation
        - keyword: Multi-Agent Path Finding
          keyword_cn: ''
          query: Evolutionary Policy Search
        - keyword: Lifelong Multi-Agent Path Finding
          keyword_cn: ''
          query: Evolutionary Reinforcement Learning
      intent_queries:
        - query: >-
            Find multi agent spatial decision making methods addressing dynamic interactions, congestion, bottlenecks,
            collision avoidance, task throughput, or long term coordination in discrete or continuous environments.
          query_cn: 查找在离散或连续环境中解决动态交互、拥堵、瓶颈、避碰、任务吞吐量或长期协调问题的方法。
          enabled: true
          source: manual
          note: ''
        - query: >-
            Find learning methods that incorporate heuristic planning, reference paths, path priors, search guidance, or
            global goal information into decentralized multi agent policies.
          query_cn: 查找将启发式规划、参考路径、路径先验、搜索引导或全局目标信息融入去中心化多智能体策略的方法。
          enabled: true
          source: manual
          note: ''
        - query: >-
            Find studies in which multiple agents make spatial movement, route selection, goal selection, collision
            avoidance, pursuit, coverage, formation, or transportation decisions, even when the task is not explicitly
            called path planning.
          query_cn: 查找多个智能体需要进行空间移动、路线选择、目标选择、避碰、追踪、覆盖、编队或运输决策的研究，即使任务没有明确称为路径规划。
          enabled: true
          source: manual
          note: ''
        - query: >-
            Find reinforcement learning, imitation learning, or planning based methods for multi agent path finding,
            lifelong multi agent path finding, cooperative navigation, and motion planning.
          query_cn: 查找用于 MAPF、LMAPF、协作导航和运动规划的强化学习、模仿学习或规划方法。
          enabled: true
          source: manual
          note: ''
      updated_at: '2026-08-04T02:55:38.652Z'
      paused: true
    - tag: hetero-marl
      description: >-
        请检索异构多智能体系统中的强化学习、协同决策、任务规划和策略优化研究。这里的异构性包括但不限于智能体在能力、角色、传感器、观测空间、动作空间、动力学模型、运动方式、通信能力、策略结构、奖励目标、实体类型或物理形态方面存在差异。
      enabled: true
      paper_sources:
        - arxiv
        - biorxiv
      keywords:
        - keyword: heterogeneous multi-agent systems
          keyword_cn: 异构多智能体系统
          query: reinforcement learning for heterogeneous multi-agent systems
        - keyword: heterogeneous multi-agent reinforcement learning
          keyword_cn: 异构多智能体强化学习
          query: reinforcement learning for heterogeneous multi-agent systems
        - keyword: multi-agent cooperative decision making
          keyword_cn: 多智能体协同决策
          query: cooperative decision making among multiple agents with heterogeneous capabilities
        - keyword: role assignment multi-agent
          keyword_cn: 多智能体角色分配
          query: role assignment and role discovery in multi-agent reinforcement learning
        - keyword: multi-agent reinforcement learning
          keyword_cn: 多智能体强化学习
          query: cooperative multi-agent reinforcement learning with heterogeneous agents
        - keyword: heterogeneous agent coordination
          keyword_cn: 异构智能体协调
          query: coordination and cooperation among heterogeneous agents
      intent_queries:
        - query: >-
            How can heterogeneous agents with different action spaces and observation models learn cooperative policies
            through multi agent reinforcement learning?
          query_cn: 异构智能体（具有不同动作空间和观测模型）如何通过多智能体强化学习学习协同策略？
          enabled: true
          source: manual
          note: ''
        - query: >-
            What methods enable role specialization and flexible team composition for heterogeneous multi robot teams in
            task allocation and path planning?
          query_cn: 哪些方法能够实现异构多机器人团队在任务分配和路径规划中的角色专业化和灵活团队组成？
          enabled: true
          source: manual
          note: ''
        - query: >-
            What methods optimize cooperative policies for heterogeneous agents with different action spaces and motion
            models?
          query_cn: 哪些方法能够为具有不同动作空间和运动模型的异构智能体优化协作策略？
          enabled: true
          source: manual
          note: ''
        - query: How to design reward functions for heterogeneous multi agent teams in task planning and decision making?
          query_cn: 如何在任务规划和决策中为异构多智能体团队设计奖励函数？
          enabled: true
          source: manual
          note: ''
      updated_at: '2026-08-06T02:37:55.937Z'
